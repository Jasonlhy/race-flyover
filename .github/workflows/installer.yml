name: Build installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  installer:
    runs-on: macos-latest
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for git describe to see tags

      - name: Build the screensaver
        run: ./build.sh

      # Optional: import a "Developer ID Installer" certificate so the pkg is
      # signed. Add the base64-encoded .p12 as the MACOS_CERTIFICATE secret and
      # its password as MACOS_CERTIFICATE_PASSWORD, plus the identity name as
      # MACOS_INSTALLER_IDENTITY. Without these secrets the pkg stays unsigned.
      - name: Import signing certificate
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p ci ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          security import /tmp/cert.p12 -k ci.keychain -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -k ci ci.keychain
          rm /tmp/cert.p12

      - name: Build the installer
        env:
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: tools/build_installer.sh "$MACOS_INSTALLER_IDENTITY"

      - uses: actions/upload-artifact@v4
        with:
          name: RaceFlyover-installer
          path: build/*.pkg
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.pkg
